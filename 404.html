<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aqal Academy</title>
<script>
// The web app lives at /app. Its pages with an id (a lesson, an Ayah) have one shared page file each, like
// lesson/[id].html; GitHub Pages only knows exact files, so an address like /app/lesson/L3 lands here. Load the
// matching shared page in place: the app reads the address and opens the right lesson.
(function () {
  var p = location.pathname;
  if (p.indexOf('/app/') !== 0) return;
  var pages = [
    [/^\/app\/lesson\/[^/]+\/?$/, '/app/lesson/[id].html'],
    [/^\/app\/checkpoint\/[^/]+\/?$/, '/app/checkpoint/[id].html'],
    [/^\/app\/practice\/[^/]+\/?$/, '/app/practice/[id].html'],
    [/^\/app\/ayah\/[^/]+\/cards\/?$/, '/app/ayah/[ref]/cards.html'],
    [/^\/app\/ayah\/[^/]+\/practice\/?$/, '/app/ayah/[ref]/practice.html'],
    [/^\/app\/ayah\/[^/]+\/?$/, '/app/ayah/[ref].html']
  ];
  var page = '/app/+not-found.html';
  for (var i = 0; i < pages.length; i++) if (pages[i][0].test(p)) { page = pages[i][1]; break; }
  document.documentElement.style.visibility = 'hidden';
  fetch(encodeURI(page)).then(function (r) { return r.text(); }).then(function (html) {
    document.open(); document.write(html); document.close();
  }, function () { document.documentElement.style.visibility = ''; });
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F3F5FB; color: #111633;
         font: 400 17px/1.6 system-ui, sans-serif; padding: 0 16px; text-align: center; }
  a { color: #0B7F62; font-weight: 700; }
  @media (prefers-color-scheme: dark) { body { background: #090D20; color: #EDEFFA; } a { color: #33C99A; } }
</style>
</head>
<body>
  <main>
    <h1 style="margin:0 0 8px;font-size:28px">This page isn't here.</h1>
    <p style="margin:0">Go to <a href="/">aqal.academy</a>.</p>
  </main>
</body>
</html>
